<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="calc.css" rel="stylesheet"></link>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <input type="text" class="display" value="" title="Calculator">
               
            
            <div class="btn_pad">
                <div class="input_row">
                    <button class="btn ac">
                        
                       AC
                    </button>
                    <button class="btn back_space">
                        ←
                        
                    </button>
                    <button class="btn open_bracket">
                        (
                    </button>
                    <button class="btn close_bracket">
                        )
                    </button>
                </div>
                <div class="input_row">
                    <button class="btn seven">
                        7

                    </button>
                    <button class="btn eight">
                        8
                    </button>
                    <button class="btn nine">
                        9
                    </button>
                    <button class="btn divide">
                        ÷
                    </button>
                </div>
                <div class="input_row">
                    <button class="btn four">
                        4

                    </button>
                    <button class="btn five">
                        5
                    </button>
                    <button class="btn six">
                        6
                    </button>
                    <button class="btn multiply">
                        *
                    </button>
                </div>
                <div class="input_row">
                    <button class="btn one">
                       1
                    </button>
                    <button class="btn two">
                        2
                    </button>
                    <button class="btn">
                        3
                    </button>
                    <button class="btn three">
                        +
                    </button>
                </div>
                <div class="input_row">
                    <button class="btn point">
                        .
                    </button>
                    <button class="btn zero">
                        0
                    </button>
                    <button class="btn modulus">
                        %
                    </button>
                    <button class="btn substract">
                        -
                    </button>
                </div>
                <div class="input_row">
                    <button class="btn power">
                       ^
                    </button>
                    <button class="btn equal">
                       = 
                    </button>
                </div>
              
    
            </div>
        </div>
      
    </div>
    <script src="calc.js"></script>
    
</body>
</html>
